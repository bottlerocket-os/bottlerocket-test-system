name: Lint
on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/lint.yaml'
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
jobs:
  checklint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - run: make mdlint
