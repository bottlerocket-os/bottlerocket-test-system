name: Lint
on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/lint.yaml'
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
jobs:
  checklint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: make mdlint
