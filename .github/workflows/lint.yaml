name: Lint
on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/lint.yaml'
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
jobs:
  checklint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: make mdlint
