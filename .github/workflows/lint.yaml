name: Lint
on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.yaml'
      - '.github/workflows/lint.yaml'
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
jobs:
  checklint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - run: make mdlint
