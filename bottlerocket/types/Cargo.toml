[package]
name = "bottlerocket-types"
version = "0.0.17"
edition = "2018"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
aws-lc-rs = { version = "1", features = ["bindgen"] }
aws-sdk-ec2 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
configuration-derive = { version = "0.0.17", path = "../../agent/configuration-derive" }
builder-derive = { version = "0.0.17", path = "../../agent/builder-derive" }
testsys-model = { version = "0.0.17", path = "../../model" }
serde = "1"
serde_plain = "1"
serde_yaml = "0.9"
serde_json = "1"
