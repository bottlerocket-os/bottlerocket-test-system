[package]
name = "agent-utils"
version = "0.0.17"
edition = "2018"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
aws-lc-rs = { version = "1", features = ["bindgen"] }
agent-common = { version = "0.0.17", path = "../../agent/agent-common" }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = "1"
aws-types = "1"
aws-sdk-iam = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-types = "1"
base64 = "0.21"
env_logger = "0.11"
log = "0.4"
testsys-model = { version = "0.0.17", path = "../../model" }
resource-agent = { version = "0.0.17", path = "../../agent/resource-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
test-agent = { version = "0.0.17", path = "../../agent/test-agent" }
tokio = { version = "1", default-features = false, features = ["time"] }
